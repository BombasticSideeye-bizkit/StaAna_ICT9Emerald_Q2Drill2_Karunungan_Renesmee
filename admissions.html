<h1>Admissions</h1>

<p>Admissions are open for this year! We have 3 levels for students, namely, Beginner, Intermediate, and Advanced. If you wish to join, please inquire below. After submitting, you will receive a confirmation email.</p>
<br>
<div class="bg" style="width: fit-content">
  <img src="sprinkles.png" alt="background" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit:cover; z-index: -1;">
<h2 style="text-align: center;">Inquiry Form</h2>
<form onsubmit="event.preventDefault(); window.location.href='thankyou.html'">
  <div class="container-fluid mt-3" style="width: fit-content">
  <div class="form-house" class="container-fluid mt-3 text-dark" style="background-color: #ffb6c1; padding: 20px; border-radius: 10px;">
    <form>
      <div class="name-inputs">
      <label for="fname">First Name:</label><br>
      <input type="text" id="fname" name="fname" required><br>
      <label for="lname">Last Name:</label><br>
      <input type="text" id="lname" name="lname" required><br>
    </div>
    <br>
    <label for="inquiry">Inquiry:</label><br>
      <select id="inquiry" name="inquiry" required>
        <option value="">Select an option</option>
        <option value="Beginner Level">Beginner Level</option>
        <option value="Intermediate Level">Intermediate Level</option>
        <option value="Advanced Level">Advanced Level</option>
      </select><br>
      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" required><br>
      <br>
      <label for="message">Leave a message (optional):</label><br>
      <textarea id="message" name="message" rows="4" cols="50"></textarea><br>
      <br>
      <input type="submit" value="Submit" class="submit-btn">
    </form>
  </div>
  </div>
  </div>
</form>
